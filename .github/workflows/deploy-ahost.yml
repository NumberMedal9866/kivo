# Builds the site on every push to main and uploads it to the ahost cPanel
# Node.js application over FTPS. Setup: docs/HOSTING_AHOST.md.
name: Deploy to ahost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ahost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Job-level so the upload step's `if` can see whether it's configured.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Node.js version selected in cPanel.
          node-version: 24
          cache: pnpm

      # Flat node_modules: the standalone bundle is uploaded over FTP, which
      # can't carry pnpm's symlinked layout.
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - run: pnpm build
        env:
          BUILD_STANDALONE: "1"

      - name: Assemble upload folder
        run: |
          node scripts/ahost/assemble.mjs
          echo "Bundle: $(find deploy -type f | wc -l) files, $(du -sh deploy | cut -f1)"

      # lftp retries failed transfers (ahost's Pure-FTPd occasionally drops a
      # TLS data connection, which aborts single-shot uploaders). Order:
      # upload new/changed files → swap the startup file → trigger the
      # restart → only then prune files the new build no longer references.
      - name: Upload to ahost (FTPS)
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          cat > upload.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          # ahost's certificate names its own host, not ftp.kiyo.uz; still encrypted.
          set ssl:verify-certificate no
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:timeout 30
          open --env-password -u "$FTP_USERNAME" "$FTP_SERVER"
          mirror --reverse --parallel=4 --verbose=1 deploy/site site
          put deploy/app.js -o app.js
          mirror --reverse deploy/tmp tmp
          put deploy/tmp/restart.txt -o tmp/restart.txt
          mirror --reverse --delete --only-missing --verbose=1 deploy/site site
          EOF
          lftp -f upload.lftp

      - name: Upload skipped
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret not set — built only. See docs/HOSTING_AHOST.md."
